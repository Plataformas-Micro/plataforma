apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-configmap
data:
  prometheus.yml: |
    scrape_configs:

      - job_name: 'GatewayMetrics'
        metrics_path: '/gateway/actuator/prometheus'
        scrape_interval: 1s
        static_configs:
          - targets:
            - gateway:8080
            labels:
              application: 'Gateway Application'

      - job_name: 'AuthMetrics'
        metrics_path: '/auth/actuator/prometheus'
        scrape_interval: 1s
        static_configs:
          - targets:
            - auth:8080
            labels:
              application: 'Auth Application'

      - job_name: 'AccountMetrics'
        metrics_path: '/accounts/actuator/prometheus'
        scrape_interval: 1s
        static_configs:
          - targets:
            - account:8080
            labels:
              application: 'Account Application'

      - job_name: 'ProductMetrics'
        metrics_path: '/products/actuator/prometheus'
        scrape_interval: 1s
        static_configs:
          - targets:
            - product:8080
            labels:
              application: 'Product Application'

      - job_name: 'ExchangeMetrics'
        metrics_path: '/metrics'
        scrape_interval: 1s
        static_configs:
          - targets:
            - exchange-service:8080
            labels:
              application: 'Exchange Application'
